<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Swallows a failed request</title></head>
<body>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="runs"><li>Nothing loaded yet.</li></ul>
  </main>
  <script>
    // INDUCED_STATE_IGNORED on the error run. There is no .catch and no ok check, so a
    // failed request produces nothing at all: no render, no announcement, no console path
    // the user can see. The page sits on "Nothing loaded yet." forever and nothing ever
    // says why.
    //
    // This is the defect that argues for induction over a manifest. Nobody writes a
    // declared "error" state for a failure path they forgot to handle, so a manifest-driven
    // gate can only ever check the error handling that already exists.
    fetch('../../api/runs.json')
      .then((r) => r.json())
      .then((runs) => {
        document.getElementById('runs').innerHTML = runs.map((x) => '<li>' + x + '</li>').join('');
        document.getElementById('status').textContent = 'Loaded ' + runs.length + ' runs.';
      });
  </script>
</body>
</html>
